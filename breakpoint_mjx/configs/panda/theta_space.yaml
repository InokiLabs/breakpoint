# Manipulation (fixed-base Franka PandaPickCube) theta space (T7).
#
# HONEST to the task: only manipulation-relevant axes. NO locomotion-only dims (torso
# mass / CoM offsets / floor-slope / gait-timed base push) -- a fixed-base arm has no
# floating base to push or tilt, and no torso CoM to shift. The model dims are read by
# name in targets._manipulation.build_manipulation_fields; the rollout dims are the
# generic obs-space adversaries + latency handled in rollout.rollout_one.
dims:
  # --- MODEL dims (per-row MJX field perturbations) --------------------------------
  # Payload mass of the manipulated cube (scale of the object body mass).
  object_mass_scale: {kind: model, bounds: [0.3, 3.0], nominal: 1.0, plausible: [0.6, 1.6]}
  # Grip slipperiness: the object's sliding friction (column 0).
  object_friction_scale: {kind: model, bounds: [0.2, 2.0], nominal: 1.0, plausible: [0.5, 1.5]}
  # Table/floor friction (affects sliding + push tasks).
  floor_friction_scale: {kind: model, bounds: [0.2, 2.0], nominal: 1.0, plausible: [0.5, 1.5]}
  # Arm position-actuator gain (Kp). Panda position actuators have no Kd, so only Kp scales.
  kp_scale: {kind: model, bounds: [0.5, 1.5], nominal: 1.0, plausible: [0.85, 1.15]}
  # Arm joint dry friction (frictionloss) on the arm dofs only.
  joint_frictionloss_scale: {kind: model, bounds: [0.5, 3.0], nominal: 1.0, plausible: [0.9, 1.3]}
  # Arm joint reflected inertia (armature) on the arm dofs only.
  joint_armature_scale: {kind: model, bounds: [0.8, 2.0], nominal: 1.0, plausible: [1.0, 1.1]}
  # --- ROLLOUT dims (generic obs-space adversaries + latency in rollout_one) --------
  # PERCEPTION is where manipulation/VLA failures live (spec 4a): per-step Gaussian noise,
  # per-step channel dropout, and a per-episode constant sensor bias on the observation.
  obs_noise_scale: {kind: rollout, bounds: [0.0, 0.10], nominal: 0.0, plausible: [0.0, 0.04]}
  obs_dropout_prob: {kind: rollout, bounds: [0.0, 0.50], nominal: 0.0, plausible: [0.0, 0.20]}
  obs_bias_scale: {kind: rollout, bounds: [0.0, 0.10], nominal: 0.0, plausible: [0.0, 0.04]}
  # Control/observation latency (action ring-buffer delay in steps).
  latency_steps: {kind: rollout, bounds: [0.0, 4.0], nominal: 0.0, plausible: [0.0, 2.0]}
