# HAND-WRITTEN FIXTURE mirroring a unitree_rl_gym humanoid-style deploy config whose
# observation carries a gait phase clock (sin, cos) after the standard terms, so num_obs
# exceeds the standard layout by 2. BreakPoint cannot produce a phase clock: fatal.
simulation_dt: 0.002
control_decimation: 10
kps: [100, 100, 100, 150, 40, 40, 100, 100, 100, 150, 40, 40]
kds: [2, 2, 2, 4, 2, 2, 2, 2, 2, 4, 2, 2]
default_angles: [-0.1, 0.0, 0.0, 0.3, -0.2, 0.0, -0.1, 0.0, 0.0, 0.3, -0.2, 0.0]
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [2.0, 2.0, 0.25]
num_actions: 12
num_obs: 47
