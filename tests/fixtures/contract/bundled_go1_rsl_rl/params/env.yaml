# HAND-WRITTEN FIXTURE in Isaac Lab's params/env.yaml layout that describes the BUNDLED
# Go1 policy (breakpoint_mjx/assets/demo/go1_policy.pkl, trained in MuJoCo Playground):
# its obs terms in Playground's order, unit scales, leg-major FR, FL, RR, RL joints,
# action scale 0.5, the Playground home pose, Kp 35 / Kd 0.5, 0.02 s control period.
# It exists so `breakpoint init --from rsl_rl` -> `check-policy --obs-spec` can be tested
# end to end on a policy that actually walks. It is not an Isaac Lab run.
sim:
  dt: 0.004
decimation: 5
scene:
  robot:
    init_state:
      joint_pos:
        FR_hip_joint: 0.1
        FL_hip_joint: -0.1
        RR_hip_joint: 0.1
        RL_hip_joint: -0.1
        .*_thigh_joint: 0.9
        .*_calf_joint: -1.8
    actuators:
      legs:
        class_type: isaaclab.actuators.actuator_pd:ImplicitActuator
        joint_names_expr:
        - .*
        stiffness: 35.0
        damping: 0.5
observations:
  policy:
    concatenate_terms: true
    enable_corruption: false
    base_lin_vel:
      func: isaaclab.envs.mdp.observations:base_lin_vel
      scale: null
    base_ang_vel:
      func: isaaclab.envs.mdp.observations:base_ang_vel
      scale: null
    projected_gravity:
      func: isaaclab.envs.mdp.observations:projected_gravity
      scale: null
    joint_pos:
      func: isaaclab.envs.mdp.observations:joint_pos_rel
      scale: null
    joint_vel:
      func: isaaclab.envs.mdp.observations:joint_vel_rel
      scale: null
    actions:
      func: isaaclab.envs.mdp.observations:last_action
      scale: null
    velocity_commands:
      func: isaaclab.envs.mdp.observations:generated_commands
      params:
        command_name: base_velocity
      scale: null
actions:
  joint_pos:
    class_type: isaaclab.envs.mdp.actions.joint_actions:JointPositionAction
    joint_names:
    - FR_hip_joint
    - FR_thigh_joint
    - FR_calf_joint
    - FL_hip_joint
    - FL_thigh_joint
    - FL_calf_joint
    - RR_hip_joint
    - RR_thigh_joint
    - RR_calf_joint
    - RL_hip_joint
    - RL_thigh_joint
    - RL_calf_joint
    preserve_order: true
    scale: 0.5
    offset: 0.0
    use_default_offset: true
