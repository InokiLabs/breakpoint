# HAND-WRITTEN FIXTURE that mirrors the layout of the params/env.yaml Isaac Lab's
# rsl_rl train.py dumps for a Unitree Go1 flat-terrain velocity task (field names,
# nesting and python tags as Isaac Lab writes them). Values are illustrative; this is
# not a copy of a real run.
viewer:
  eye: !!python/tuple
  - 7.5
  - 7.5
  - 7.5
sim:
  dt: 0.005
  render_interval: 4
decimation: 4
episode_length_s: 20.0
scene:
  num_envs: 4096
  env_spacing: 2.5
  robot:
    class_type: isaaclab.assets.articulation.articulation:Articulation
    prim_path: /World/envs/env_.*/Robot
    init_state:
      pos: !!python/tuple
      - 0.0
      - 0.0
      - 0.4
      joint_pos:
        .*L_hip_joint: 0.1
        .*R_hip_joint: -0.1
        F[L,R]_thigh_joint: 0.8
        R[L,R]_thigh_joint: 1.0
        .*_calf_joint: -1.5
      joint_vel:
        .*: 0.0
    actuators:
      base_legs:
        class_type: isaaclab.actuators.actuator_pd:DCMotor
        joint_names_expr:
        - .*_hip_joint
        - .*_thigh_joint
        - .*_calf_joint
        effort_limit: 23.5
        saturation_effort: 23.5
        velocity_limit: 30.0
        stiffness: 25.0
        damping: 0.5
        friction: 0.0
observations:
  policy:
    concatenate_terms: true
    enable_corruption: true
    history_length: null
    base_lin_vel:
      func: isaaclab.envs.mdp.observations:base_lin_vel
      params: {}
      modifiers: null
      noise:
        func: isaaclab.utils.noise.noise_model:uniform_noise
        operation: add
        n_min: -0.1
        n_max: 0.1
      clip: null
      scale: null
    base_ang_vel:
      func: isaaclab.envs.mdp.observations:base_ang_vel
      params: {}
      noise:
        func: isaaclab.utils.noise.noise_model:uniform_noise
        n_min: -0.2
        n_max: 0.2
      clip: null
      scale: null
    projected_gravity:
      func: isaaclab.envs.mdp.observations:projected_gravity
      params: {}
      noise:
        func: isaaclab.utils.noise.noise_model:uniform_noise
        n_min: -0.05
        n_max: 0.05
      clip: null
      scale: null
    velocity_commands:
      func: isaaclab.envs.mdp.observations:generated_commands
      params:
        command_name: base_velocity
      clip: null
      scale: null
    joint_pos:
      func: isaaclab.envs.mdp.observations:joint_pos_rel
      params: {}
      noise:
        func: isaaclab.utils.noise.noise_model:uniform_noise
        n_min: -0.01
        n_max: 0.01
      clip: null
      scale: null
    joint_vel:
      func: isaaclab.envs.mdp.observations:joint_vel_rel
      params: {}
      noise:
        func: isaaclab.utils.noise.noise_model:uniform_noise
        n_min: -1.5
        n_max: 1.5
      clip: null
      scale: null
    actions:
      func: isaaclab.envs.mdp.observations:last_action
      params: {}
      clip: null
      scale: null
    height_scan: null
actions:
  joint_pos:
    class_type: isaaclab.envs.mdp.actions.joint_actions:JointPositionAction
    asset_name: robot
    debug_vis: false
    clip: null
    joint_names:
    - .*
    scale: 0.25
    offset: 0.0
    preserve_order: false
    use_default_offset: true
# Training domain randomization, in Isaac Lab's EventCfg dump layout (velocity_env_cfg.py
# EventCfg field names). Ranges are illustrative, like the rest of this fixture.
events:
  physics_material:
    func: isaaclab.envs.mdp.events:randomize_rigid_body_material
    mode: startup
    params:
      asset_cfg: {name: robot, body_names: .*}
      static_friction_range: !!python/tuple [0.6, 1.0]
      dynamic_friction_range: !!python/tuple [0.4, 0.8]
      restitution_range: !!python/tuple [0.0, 0.0]
      num_buckets: 64
  add_base_mass:
    func: isaaclab.envs.mdp.events:randomize_rigid_body_mass
    mode: startup
    params:
      asset_cfg: {name: robot, body_names: trunk}
      mass_distribution_params: !!python/tuple [-1.0, 3.0]
      operation: add
  push_robot:
    func: isaaclab.envs.mdp.events:push_by_setting_velocity
    mode: interval
    interval_range_s: !!python/tuple [10.0, 15.0]
    params:
      velocity_range:
        x: !!python/tuple [-0.5, 0.5]
        y: !!python/tuple [-0.5, 0.5]
  reset_base:
    func: isaaclab.envs.mdp.events:reset_root_state_uniform
    mode: reset
    params:
      pose_range: {x: !!python/tuple [-0.5, 0.5], y: !!python/tuple [-0.5, 0.5]}
