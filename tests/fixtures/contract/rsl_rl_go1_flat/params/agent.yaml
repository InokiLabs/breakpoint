# HAND-WRITTEN FIXTURE mirroring Isaac Lab's rsl_rl params/agent.yaml layout.
seed: 42
device: cuda:0
num_steps_per_env: 24
max_iterations: 1500
empirical_normalization: true
clip_actions: null
experiment_name: unitree_go1_flat
policy:
  class_name: ActorCritic
  init_noise_std: 1.0
  actor_hidden_dims:
  - 128
  - 128
  - 128
  critic_hidden_dims:
  - 128
  - 128
  - 128
  activation: elu
algorithm:
  class_name: PPO
  learning_rate: 0.001
  gamma: 0.99
