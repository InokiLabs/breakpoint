[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breakpoint-mjx"
version = "0.1.0"
description = "Crash-testing for robot control policies: GPU-parallel failure search, ratings and a CI gate in MuJoCo MJX"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Inoki Labs" }]
keywords = ["robotics", "simulation", "mujoco", "mjx", "testing", "reinforcement-learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core stays light on purpose so the CLI, report and attestation tooling install in
# seconds. The simulator stack is an extra because jax + mujoco + brax is a large install
# that should land on the right CUDA build for your machine.
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
# Everything the engine imports at run time. flax is pinned because newer releases raise
# their jax floor past <0.9 (see requirements.txt for the full story).
sim = ["mujoco>=3.2", "mujoco-mjx>=3.2", "jax>=0.4.30,<0.9", "brax>=0.12", "flax==0.12.6",
       "playground>=0.0.4", "evosax>=0.1.6", "scikit-learn>=1.4", "mediapy>=1.2",
       "imageio[ffmpeg]>=2.34"]
onnx = ["onnx>=1.16"]
attest = ["cryptography>=42"]   # ed25519 report signing (breakpoint keys/sign/verify)
llm = ["anthropic>=0.69", "httpx>=0.27"]
dev = ["pytest>=8", "scikit-learn>=1.4"]   # clustering tests import sklearn without the sim stack
bench = ["matplotlib>=3.8", "scipy>=1.11"]   # benchmark/ figures and statistics

[project.scripts]
breakpoint = "breakpoint_mjx.cli:main"

[project.urls]
Source = "https://github.com/InokiLabs/breakpoint"

[tool.setuptools.packages.find]
include = ["breakpoint_mjx*"]

# The YAML configs (search.yaml + per-robot theta spaces) and batteries are data the
# engine cannot run without, so they ship in the wheel, as does the sample report that
# `breakpoint demo --view` opens.
[tool.setuptools.package-data]
breakpoint_mjx = ["configs/*.yaml", "configs/**/*.yaml", "batteries/*.yaml",
                  "assets/demo/*.pkl", "assets/demo/*.yaml",
                  "assets/demo/sample_report/*.html", "assets/demo/sample_report/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["no_crypto_needed: runs even without the optional cryptography package"]
